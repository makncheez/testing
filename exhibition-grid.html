<!-- ============================================================
     Armenian Image Archive — Exhibition Grid (WordPress embed)

     Paste this entire block into a WPBakery "Raw HTML" element.
     Everything (styles, markup, script) is scoped under the
     #aia-exhibit-grid wrapper so it cannot leak onto, or be broken
     by, the host theme/plugins. Grid only — no page header/footer.

     TO ADD A NEW EXHIBITION CARD: add one object to the EXHIBITS
     array below (near the bottom of the <script> block). Each card
     takes four fields:
       img      - image shown at rest
       hoverImg - image shown on hover (use the same URL as img if
                  you don't have a separate hover asset)
       hoverText - text shown centered over the image on hover
       link     - the exhibition URL, or '' for an unlinked
                  "Coming Soon" card
     The grid reflows itself automatically — no other edits needed.
     ============================================================ -->
<div id="aia-exhibit-grid">
  <style>
    #aia-exhibit-grid, #aia-exhibit-grid *, #aia-exhibit-grid *::before, #aia-exhibit-grid *::after {
      box-sizing: border-box !important;
    }
    #aia-exhibit-grid {
      width: 100%;
      padding: 20px;
    }
    #aia-exhibit-grid img { max-width: 100%; display: block; border: 0; }

    #aia-exhibit-grid .aia-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    #aia-exhibit-grid .aia-card {
      position: relative;
      display: block;
      overflow: hidden;
      cursor: pointer;
    }
    #aia-exhibit-grid .aia-card.aia-soon { cursor: default; }
    #aia-exhibit-grid .aia-img-base {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
      transition: opacity 0.4s ease;
    }
    #aia-exhibit-grid .aia-img-hover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 0.4s ease;
    }
    #aia-exhibit-grid .aia-img-base { opacity: 1; }
    #aia-exhibit-grid .aia-img-hover { opacity: 0; }
    #aia-exhibit-grid .aia-card:hover .aia-img-base { opacity: 0; }
    #aia-exhibit-grid .aia-card:hover .aia-img-hover { opacity: 1; }

    #aia-exhibit-grid .aia-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      background: rgba(0, 0, 0, 0.75);
      pointer-events: none;
      text-align: center;
    }
    #aia-exhibit-grid .aia-card:hover .aia-overlay { opacity: 1; }
    #aia-exhibit-grid .aia-overlay-text {
      color: #fff;
      font-size: 1.1em;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 10px 18px;
    }

    @media (max-width: 640px) {
      #aia-exhibit-grid { padding: 20px; }
      #aia-exhibit-grid .aia-grid { grid-template-columns: 1fr; gap: 20px; }
      #aia-exhibit-grid .aia-overlay-text { font-size: 0.9em; padding: 8px 12px; }
    }
  </style>

  <div class="aia-grid" id="aiaExhibitGridCards"></div>

  <script>
  (function () {
    // To add a new exhibition: add one object here. Cards render in
    // array order; the CSS grid reflows on its own as the list grows,
    // so there is no row/column math to redo by hand.
    var EXHIBITS = [
      { img: 'http://www.armenianimage.org/wp-content/uploads/2026/10/kazanjian_cover.png', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2026/10/kazanjian_cover.png', hoverText: 'Enter Exhibition', link: 'https://www.armenianimage.org/wp-content/exhibit/kazanjian/', alt: 'Aram Kazanjian Pictorialism From Boston To New York' },
      { img: 'http://malikianphotography.com/wp-content/uploads/2024/05/book_jaffaroad.png', hoverImg: 'http://malikianphotography.com/wp-content/uploads/2024/05/book_jaffaroad.png', hoverText: 'Enter Exhibition', link: 'http://malikianphotography.com/jaffaroad/', alt: 'The Krikorians of Jaffa Road' },
     { img: 'http://www.armenianimage.org/wp-content/uploads/2023/01/part1_kurk.png', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2023/01/part1_kurk.png', hoverText: 'Enter Exhibition', link: 'https://www.armenianimage.org/exhibition-part1-ohannes-kurkdjian/', alt: 'Ohannes Kurkdjian, Part 1' },
      { img: 'http://www.armenianimage.org/wp-content/uploads/2023/01/part2_kurk.png', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2023/01/part2_kurk.png', hoverText: 'Enter Exhibition', link: 'http://www.armenianimage.org/exhibition-part-2-ohannes-kurkdjian-surabaya/', alt: 'Ohannes Kurkdjian, Part 2: Surabaya' },
      { img: 'http://www.armenianimage.org/wp-content/uploads/2022/04/cover_via_dolorosapng.png', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2022/04/cover_via_dolorosapng.png', hoverText: 'Enter Exhibition', link: 'http://www.armenianimage.org/viadolorosa/viadolorosa-intro/', alt: 'Studio Bonfils: Via Dolorosa' },
      { img: 'http://www.armenianimage.org/wp-content/uploads/2021/10/aftermath2-1.png', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2021/10/aftermath2-1.png', hoverText: 'Enter Exhibition', link: 'https://www.armenianimage.org/exhibition-aftermath/exhibition-aftermath-entrance/', alt: 'Aftermath: The Armenian Earthquake of 1988' },
      { img: 'http://www.armenianimage.org/wp-content/uploads/2021/11/davis-cover3.png', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2021/11/davis-cover3.png', hoverText: 'Enter Exhibition', link: 'https://www.armenianimage.org/exhibition-davis-collection/', alt: 'Leslie Davis Collection: Lost and Found' },
      { img: 'http://www.armenianimage.org/wp-content/uploads/2026/07/cover_art6.jpg', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2026/07/cover_art6.jpg', hoverText: 'Enter Exhibition', link: 'https://www.armenianimage.org/exhibition-elia-kahvedjian/exhibition-elia-kahvedjian-entrance/', alt: 'Elia Kahvedjian' },
      { img: 'http://www.armenianimage.org/wp-content/uploads/2026/07/cover3-1.jpg', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2026/07/cover3-1.jpg', hoverText: 'Enter Exhibition', link: 'https://www.armenianimage.org/exhibition-krikor-djololian/exhibition-krikor-djololian-entrance/', alt: 'Krikor Djololian' },
      { img: 'http://www.armenianimage.org/wp-content/uploads/2026/07/22.jpg', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2026/07/22.jpg', hoverText: 'Enter Exhibition', link: 'https://www.armenianimage.org/exhibition-haroutiun-derhagopian-part-1/exhibition-haroutiun-derhagopian-entrance/', alt: 'Haroutiun Derhagopian' },
      { img: 'http://www.armenianimage.org/wp-content/uploads/2026/07/cover_k_derahgo.jpg', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2026/07/cover_k_derahgo.jpg', hoverText: 'Enter Exhibition', link: 'https://www.armenianimage.org/exhibition-kevork-derhagopian-part-2/exhibition-kevork-derhagopian-part-2-entrance/', alt: 'Kevork Derhagopian, Part 2' },
      { img: 'http://www.armenianimage.org/wp-content/uploads/2026/07/cover_art8.jpg', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2026/07/cover_art8.jpg', hoverText: 'Coming Soon', link: '', alt: 'Coming Soon' },
      { img: 'http://www.armenianimage.org/wp-content/uploads/2026/07/cover_art5.jpg', hoverImg: 'http://www.armenianimage.org/wp-content/uploads/2026/07/cover_art5.jpg', hoverText: 'Coming Soon', link: '', alt: 'Coming Soon' }
    ];

    var grid = document.getElementById('aiaExhibitGridCards');
    if (!grid) return;

    EXHIBITS.forEach(function (item) {
      var isLink = !!item.link;
      var card = document.createElement(isLink ? 'a' : 'div');
      card.className = 'aia-card' + (isLink ? '' : ' aia-soon');
      if (isLink) card.href = item.link;

      var base = document.createElement('img');
      base.className = 'aia-img-base';
      base.src = item.img;
      base.alt = item.alt || '';
      base.loading = 'lazy';
      card.appendChild(base);

      var hover = document.createElement('img');
      hover.className = 'aia-img-hover';
      hover.src = item.hoverImg || item.img;
      hover.alt = '';
      hover.loading = 'lazy';
      card.appendChild(hover);

      var overlay = document.createElement('div');
      overlay.className = 'aia-overlay';
      var text = document.createElement('div');
      text.className = 'aia-overlay-text';
      text.textContent = item.hoverText || (isLink ? 'Enter Exhibition' : 'Coming Soon');
      overlay.appendChild(text);
      card.appendChild(overlay);

      grid.appendChild(card);
    });
  })();
  </script>
</div>

<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Index: Aram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;1,400&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Instrument+Serif&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    width: 100%;
    background: var(--color-tan);
    font-size: 12px;
    font-family: 'Cardo', "Times New Roman", Times, serif;
  }

  * { box-sizing: border-box; }

  :root {
    --color-tan: #D5CCA4;
    --color-green: #263F27;
    --color-purple: #9767a3;
    --color-black: #000;
  }

  a { color: inherit; }

  /* ---- Page transition: hard push-slide, arriving from index.html ----
     The arriving document's stylesheet drives both pseudo-elements: this
     page (always entered from index.html) pushes the old page left and
     enters from the right; index.html reverses it for the return trip. */

  @view-transition {
    navigation: auto;
  }

  ::view-transition-image-pair(root) {
    isolation: auto;
  }

  ::view-transition-old(root),
  ::view-transition-new(root) {
    mix-blend-mode: normal;
  }

  ::view-transition-old(root) {
    animation: 420ms cubic-bezier(.65, 0, .35, 1) both qf-slide-out;
  }

  ::view-transition-new(root) {
    animation: 420ms cubic-bezier(.65, 0, .35, 1) both qf-slide-in;
  }

  @keyframes qf-slide-out {
    to { transform: translateX(-100%); }
  }

  @keyframes qf-slide-in {
    from { transform: translateX(100%); }
  }

  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none !important;
    }
  }

  /* ---- Aram Navigation: recall portrait + speech-bubble menu ---- */

  .qf-portrait {
    position: fixed;
    top: 40px;
    left: 50%;
    z-index: 20;
    width: 150px;
    aspect-ratio: 338 / 456;
    transform: translate(-50%, -50%);
    pointer-events: none;
    background-image: url("https://codeplayfully.online/img_uploads/aram_circle.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: var(--color-tan);
    background-blend-mode: multiply;
    border-radius: 50% / 37%;
    border: 4px solid var(--color-purple);
    box-shadow: 0 4px 6.2px 2px rgba(0, 0, 0, 0.25);
  }

  .qf-portrait-recall-wrap {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 999999;
    width: 106px;
    aspect-ratio: 1 / 1;
    pointer-events: auto;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0s linear 0.4s;
  }

  .qf-portrait-recall-wrap.is-visible {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.4s ease;
  }

  .qf-portrait-recall-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    transform: rotate(-90deg);
  }

  .qf-portrait-recall-ring-track {
    fill: none;
    stroke: var(--color-tan);
    stroke-width: 4;
    opacity: 0;
  }

  .qf-portrait-recall-ring-progress {
    fill: none;
    stroke: var(--color-purple);
    stroke-width: 4;
    stroke-linecap: round;
  }

  .qf-portrait-recall {
    position: absolute;
    top: 50%;
    left: 50%;
    bottom: auto;
    width: 90px;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    z-index: 1;
    background-color: transparent;
    background-blend-mode: normal;
    border-radius: 50%;
    border: none;
    padding: 0;
    font: inherit;
    cursor: pointer;
    pointer-events: auto;
  }

  .qf-portrait-recall:focus-visible {
    outline: 3px solid var(--color-purple);
    outline-offset: 3px;
  }

  .qf-portrait-recall[aria-expanded="true"] {
    background-image: url("./images/1/portrait_alt.png");
  }

  .qf-nav-bubble {
    position: fixed;
    left: 0;
    bottom: 24px;
    z-index: 999999;
    width: 260px;
    max-width: calc(100vw - 32px);
    background: var(--color-tan);
    border: 3px solid var(--color-green);
    border-radius: 24px;
    padding: 5px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: scale(0.95);
    transform-origin: left bottom;
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s;
  }

  .qf-nav-bubble.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: scale(1);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .qf-nav-bubble::before,
  .qf-nav-bubble::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 53px;
    width: 0;
    height: 0;
    border-style: solid;
    transform: translate(-100%, 50%);
  }

  .qf-nav-bubble::before {
    border-width: 14px 17px 14px 0;
    border-color: transparent var(--color-green) transparent transparent;
  }

  .qf-nav-bubble::after {
    border-width: 11px 13px 11px 0;
    border-color: transparent var(--color-tan) transparent transparent;
  }

  .qf-nav-bubble-title {
    font-family: 'DM Mono', monospace;
    font-size: 1.5em;
    text-align: center;
    letter-spacing: 0px;
    color: var(--color-green);
    padding: 5px;
    margin: 0px;
    border-bottom: 1.4px solid var(--color-green);
  }

  .qf-nav-bubble-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 20px;
    font-family: 'Instrument Serif', serif;
    font-size: 1.85em;
    white-space: nowrap;
    color: var(--color-green);
    text-decoration: none;
    border-bottom: 1.4px solid var(--color-green);
  }

  .qf-nav-bubble-item:last-child {
    border-bottom: none;
  }

  .qf-nav-bubble-item:hover,
  .qf-nav-bubble-item:focus-visible {
    background: rgba(38, 63, 39, 0.08);
    outline: none;
  }

  .qf-nav-bubble-arrow {
    flex-shrink: 0;
    font-family: 'Material Symbols Outlined';
    font-size: 1em;
  }

  /* ---- Filter bar ---- */

  .filter-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    padding: 20px 40px;
    background: var(--color-tan);
    border-bottom: 1.4px solid var(--color-green);
  }

  .filter-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .filter-field label {
    font-family: 'DM Mono', monospace;
    font-size: 1em;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--color-green);
  }

  .filter-field select {
    font-family: 'DM Mono', monospace;
    font-size: 1.2em;
    padding: 8px 10px;
    border: 1.4px solid var(--color-green);
    border-radius: 6px;
    background: var(--color-tan);
    color: var(--color-black);
    min-width: 180px;
  }

  .filter-reset {
    align-self: flex-end;
    font-family: 'DM Mono', monospace;
    font-size: 1.2em;
    letter-spacing: 0.02em;
    padding: 9px 18px;
    border: 1.4px solid var(--color-purple);
    border-radius: 999px;
    background: transparent;
    color: var(--color-purple);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .filter-reset:hover,
  .filter-reset:focus-visible {
    background: var(--color-purple);
    color: var(--color-tan);
  }

  .filter-count {
    margin-left: auto;
    align-self: flex-end;
    font-family: 'DM Mono', monospace;
    font-size: 1.2em;
    color: var(--color-black);
  }

  /* ---- Grid ---- */

  .image-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px 32px;
    padding: 40px;
  }

  .image-card {
    display: flex;
    flex-direction: column;
  }

  .image-card.is-hidden {
    display: none;
  }

  .image-card-figure {
    margin: 0 0 12px;
  }

  .image-card-figure img {
    display: block;
    width: 100%;
    height: auto;
    border: 1.4px solid var(--color-green);
  }

  .image-card-caption {
    font-size: 1.4em;
    line-height: 1.6em;
    margin: 0 0 20px;
    padding: 0;
    -webkit-hyphens: auto;
    hyphens: auto;
    color: var(--color-black);
  }

  .image-card-keywords {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .image-card-keyword {
    font-family: 'DM Mono', monospace;
    font-size: 0.9em;
    letter-spacing: 0.02em;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--color-green);
    color: var(--color-tan);
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .image-card-keyword:hover,
  .image-card-keyword:focus-visible {
    background: var(--color-purple);
    color: var(--color-tan);
  }

  .image-card-keyword.is-collection {
    background: transparent;
    border: 1px solid var(--color-purple);
    color: var(--color-purple);
  }

  .image-card-keyword.is-collection:hover,
  .image-card-keyword.is-collection:focus-visible {
    background: var(--color-purple);
    color: var(--color-tan);
  }

  .empty-state {
    display: none;
    padding: 60px 0;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 1.3em;
    color: var(--color-black);
  }

  .empty-state.is-visible {
    display: block;
  }

  @media (max-width: 1000px) {
    .image-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 700px) {
    .filter-bar {
      padding: 16px 24px;
    }

    .filter-count {
      margin-left: 0;
    }

    .image-grid {
      grid-template-columns: 1fr;
      gap: 32px;
      padding: 24px;
    }
  }
</style>

<div class="qf-portrait-recall-wrap" id="portraitRecallWrap">
  <svg class="qf-portrait-recall-ring" viewBox="0 0 100 100">
    <circle class="qf-portrait-recall-ring-track" cx="50" cy="50" r="46"></circle>
    <circle class="qf-portrait-recall-ring-progress" id="portraitRingProgress" cx="50" cy="50" r="46"></circle>
  </svg>
  <button type="button" class="qf-portrait qf-portrait-recall" id="quotePortraitRecall" aria-haspopup="true" aria-expanded="false" aria-controls="portraitNavBubble" aria-label="Open Aram Navigation menu"></button>
</div>

<div class="filter-bar">
  <div class="filter-field">
    <label for="filterSection">Section</label>
    <select id="filterSection">
      <option value="">All sections</option>
    </select>
  </div>
  <div class="filter-field">
    <label for="filterDecade">Decade</label>
    <select id="filterDecade">
      <option value="">All decades</option>
    </select>
  </div>
  <div class="filter-field">
    <label for="filterCollection">Collection</label>
    <select id="filterCollection">
      <option value="">All collections</option>
    </select>
  </div>
  <button type="button" class="filter-reset" id="filterReset">Reset filters</button>
  <div class="filter-count" id="filterCount"></div>
</div>

<div class="image-grid" id="imageList"></div>
<div class="empty-state" id="emptyState">No images match these filters.</div>

<script>
  (function () {
    var portraitRecallWrap = document.getElementById('portraitRecallWrap');
    var portraitRingProgress = document.getElementById('portraitRingProgress');
    var portraitBtn = document.getElementById('quotePortraitRecall');
    var navBubble = document.getElementById('portraitNavBubble');
    var navTopLink = document.getElementById('navTopOfPage');
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (portraitRecallWrap) {
      var portraitLingerTimer = null;
      var navOpen = false;
      var RING_R = 46;
      var RING_CIRC = 2 * Math.PI * RING_R;
      if (portraitRingProgress) {
        portraitRingProgress.style.strokeDasharray = String(RING_CIRC);
        portraitRingProgress.style.strokeDashoffset = String(RING_CIRC);
      }

      function updateRingProgress() {
        if (!portraitRingProgress) return;
        var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        var progress = maxScroll > 0 ? window.scrollY / maxScroll : 0;
        progress = Math.max(0, Math.min(1, progress));
        portraitRingProgress.style.strokeDashoffset = String(RING_CIRC * (1 - progress));
      }

      function armLingerTimer() {
        window.clearTimeout(portraitLingerTimer);
        portraitLingerTimer = window.setTimeout(function () {
          portraitRecallWrap.classList.remove('is-visible');
        }, 4000);
      }

      function positionNavBubble() {
        if (!portraitBtn || !navBubble) return;
        var rect = portraitBtn.getBoundingClientRect();
        var gap = 16;
        var bubbleWidth = navBubble.offsetWidth || 260;
        var left = rect.right + gap;
        var maxLeft = window.innerWidth - bubbleWidth - 16;
        left = Math.max(16, Math.min(left, maxLeft));
        navBubble.style.left = left + 'px';
      }

      function openNavBubble() {
        if (!navBubble || !portraitBtn) return;
        navOpen = true;
        positionNavBubble();
        navBubble.classList.add('is-open');
        portraitBtn.setAttribute('aria-expanded', 'true');
        window.clearTimeout(portraitLingerTimer);
        portraitRecallWrap.classList.add('is-visible');
      }

      function closeNavBubble() {
        if (!navBubble || !portraitBtn) return;
        navOpen = false;
        navBubble.classList.remove('is-open');
        portraitBtn.setAttribute('aria-expanded', 'false');
        armLingerTimer();
      }

      if (portraitBtn) {
        portraitBtn.addEventListener('click', function () {
          if (navOpen) {
            closeNavBubble();
          } else {
            openNavBubble();
          }
        });
      }

      if (navTopLink) {
        navTopLink.addEventListener('click', function (e) {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
          closeNavBubble();
        });
      }

      document.addEventListener('click', function (e) {
        if (!navOpen) return;
        if (navBubble.contains(e.target) || portraitBtn.contains(e.target)) return;
        closeNavBubble();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && navOpen) closeNavBubble();
      });

      window.addEventListener('resize', function () {
        if (navOpen) positionNavBubble();
      });

      // Polled via rAF instead of a 'scroll' listener: on mobile a nested
      // scrollable ancestor (or a browser that throttles/coalesces scroll
      // events during touch momentum) can leave 'scroll' events on window
      // unreliable. Reading window.scrollY directly every frame sidesteps
      // that entirely.
      var portraitLastScrollY = window.scrollY;
      function pollPortraitScroll() {
        updateRingProgress();
        var currentScrollY = window.scrollY;
        if (!navOpen && currentScrollY !== portraitLastScrollY) {
          window.clearTimeout(portraitLingerTimer);
          portraitRecallWrap.classList.add('is-visible');
          armLingerTimer();
        }
        portraitLastScrollY = currentScrollY;
        window.requestAnimationFrame(pollPortraitScroll);
      }
      window.requestAnimationFrame(pollPortraitScroll);
    }

    var images = [
      { src: './images/1/10.png', caption: 'Portrait of a young woman, ca. 1910, with a stamp on the mount of Charles H. Gallup, owner of the renowned Gallup photographic studio in Poughkeepsie, New York. Arsen Diran, Diran Studio, Boston. Courtesy of the Malikian Collection.', section: 'Diran Studio', decade: '1910s', collection: 'Malikian Collection' },
      { src: './images/1/11.png', caption: 'Wedding portrait of an Armenian couple, ca. 1900. Arsen Diran, Diran Studio, Boston. Courtesy of the Malikian Collection.', section: 'Diran Studio', decade: '1900s', collection: 'Malikian Collection' },
      { src: './images/1/12.png', caption: 'Wedding portrait of an Armenian couple, ca. 1900. Diran Studio, Boston. Courtesy of the Malikian Collection.', section: 'Diran Studio', decade: '1900s', collection: 'Malikian Collection' },
      { src: './images/1/13.png', caption: 'Family portrait, ca. 1910. Diran Studio, Boston. Courtesy of the Malikian Collection.', section: 'Diran Studio', decade: '1910s', collection: 'Malikian Collection' },

      { src: './images/1/15.png', caption: 'Armenian baby, ca. 1925. Diran Studio, Boston. Courtesy of the Malikian Collection.', section: 'Diran Studio', decade: '1920s', collection: 'Malikian Collection' },
      { src: './images/1/16.png', caption: 'Dorchester High School Cadets, 1910. Diran Studio, Boston. Courtesy of the Malikian Collection.', section: 'Diran Studio', decade: '1910s', collection: 'Malikian Collection' },
      { src: './images/1/1.png', caption: 'John Higue Garo (1875–1939), Armenian American portrait photographer and painter, seated reading a newspaper. Photographed by Yousuf Karsh.', section: 'Garo Studio', decade: 'Undated', collection: 'Uncredited' },
      { src: './images/1/1a.png', caption: '“Untitled,” 1911. Garo Studio, Boston. Yearbook of the Photographers’ Association of New England, Bridgeport Convention.', section: 'Garo Studio', decade: '1910s', collection: 'Uncredited' },
      { src: './images/1/2.png', caption: 'Geraldine Farrar (1882–1967), 1908. Lyric soprano and actress in silent films. Garo Studio, Boston. Courtesy of the Library of Congress.', section: 'Garo Studio', decade: '1900s', collection: 'Library of Congress' },
      { src: './images/1/3.png', caption: 'Laurente Torno (1903–1992), 1927. Musician, conductor, radio and music host. Garo Studio, Boston. Courtesy of the Harvard Art Museums, Fogg Museum.', section: 'Garo Studio', decade: '1920s', collection: 'Harvard Art Museums, Fogg Museum' },
      { src: './images/1/4.png', caption: 'Portrait of a woman, ca. 1900. Garo Studio, Boston. Courtesy of the Museum of Fine Arts, Boston.', section: 'Garo Studio', decade: '1900s', collection: 'Museum of Fine Arts, Boston' },
      { src: './images/1/5.png', caption: 'Samuel Mandell (1850–1920), 1916. Businessman and philanthropist. Garo Studio, Boston. Courtesy of Harvard Art Museums, Fogg Museum.', section: 'Garo Studio', decade: '1910s', collection: 'Harvard Art Museums, Fogg Museum' },
      { src: './images/1/5a.png', caption: 'Malvina V. Longfellow (1889–1962), 1910. Stage and silent movie actress. Depicting her role in ‘The Watcher’ or the ‘Whirlwind.’ Garo Studio, Boston. Courtesy of the Library of Congress.', section: 'Garo Studio', decade: '1910s', collection: 'Library of Congress' },
      { src: './images/1/5b.png', caption: '“Portrait.” Garo Studio, Boston. Winner of the C. P. Goerz Silver Cup, 1906. Courtesy of The Photographic Times, Volume 38, No.9, September 1906, page 432. New York: The Photographic Times Publishing Association.', section: 'Garo Studio', decade: '1900s', collection: 'The Photographic Times' },
      { src: './images/1/6.png', caption: '“The Bubble.” Garo Studio. Photograms of 1912 in the annual publication of “London Salon of Photography.” Courtesy of the Malikian Collection.', section: 'Garo Studio', decade: '1910s', collection: 'Malikian Collection' },
      { src: './images/1/7.png', caption: '“Portrait of a Gentleman.” Garo Studio. Photograms of 1914 in the annual publication of “London Salon of Photography.” Courtesy of the Malikian Collection.', section: 'Garo Studio', decade: '1910s', collection: 'Malikian Collection' },
      { src: './images/1/8.png', caption: 'The Spur, October 1, 1923. Wedding portrait of Mrs. Henry Hardwick Faxon. Garo Studio, Boston. Courtesy of the Malikian Collection.', section: 'Garo Studio', decade: '1920s', collection: 'Malikian Collection' },
      { src: './images/1/9.png', caption: 'The Spur, July 1, 1924. Wedding portrait of Mrs. David Hunter McAlpin 3rd. Garo Studio, Boston. Courtesy of the Malikian Collection.', section: 'Garo Studio', decade: '1920s', collection: 'Malikian Collection' },
      { src: './images/1/9a.png', caption: 'The Spur, February 15, 1926. Portrait of Miss Barbara Greenough. Garo Studio, Boston. Courtesy of the Malikian Collection.', section: 'Garo Studio', decade: '1920s', collection: 'Malikian Collection' },
      { src: './images/3/1.jpg', caption: 'Caption pending.', section: 'Kazanjian Family & Boston Studio', decade: 'Undated', collection: 'Uncredited' },
      { src: './images/2/1.png', caption: 'Aram Kazanjian with his wife, Leah Ethel Davis Kazanjian and daughter Arlene Kazanjian Francis, ca. 1910. Courtesy of Arlene Kazanjian Francis.', section: 'Kazanjian Family & Boston Studio', decade: '1910s', collection: 'Arlene Kazanjian Francis' },
      { src: './images/2/2.png', caption: 'Aram Kazanjian with his wife, Leah Ethel Davis Kazanjian, daughter, Arlene Kazanjian Francis, and grandson, Peter Gabel, ca. 1960. Courtesy of Tombstone Tourist.', section: 'Kazanjian Family & Boston Studio', decade: '1960s', collection: 'Tombstone Tourist' },
      { src: './images/2/3.png', caption: 'Arlene Kazanjian Francis, 1946, daughter of Aram and Leah Kazanjian. Unknown Photographer. Courtesy of the Malikian Collection.', section: 'Kazanjian Family & Boston Studio', decade: '1940s', collection: 'Malikian Collection' },
      { src: './images/2/4.png', caption: 'Aram Kazanjian, ca. 1900. Boston Globe, October 6, 1905.', section: 'Kazanjian Family & Boston Studio', decade: '1900s', collection: 'Uncredited' },

    ];

    var DECADE_ORDER = ['1900s', '1910s', '1920s', '1930s', '1940s', '1950s', '1960s', 'Undated'];

    function uniqueSorted(values, order) {
      var seen = {};
      var out = [];
      values.forEach(function (v) {
        if (!seen[v]) { seen[v] = true; out.push(v); }
      });
      if (order) {
        out.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
      } else {
        out.sort();
      }
      return out;
    }

    function populateSelect(select, values) {
      values.forEach(function (v) {
        var opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      });
    }

    var sectionSelect = document.getElementById('filterSection');
    var decadeSelect = document.getElementById('filterDecade');
    var collectionSelect = document.getElementById('filterCollection');
    var resetBtn = document.getElementById('filterReset');
    var countEl = document.getElementById('filterCount');
    var listEl = document.getElementById('imageList');
    var emptyEl = document.getElementById('emptyState');

    populateSelect(sectionSelect, uniqueSorted(images.map(function (d) { return d.section; })));
    populateSelect(decadeSelect, uniqueSorted(images.map(function (d) { return d.decade; }), DECADE_ORDER));
    populateSelect(collectionSelect, uniqueSorted(images.map(function (d) { return d.collection; })));

    function makeKeywordLink(text, select, isCollection) {
      var a = document.createElement('a');
      a.href = '#';
      a.className = 'image-card-keyword' + (isCollection ? ' is-collection' : '');
      a.textContent = text;
      a.addEventListener('click', function (e) {
        e.preventDefault();
        select.value = text;
        applyFilters();
        listEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      return a;
    }

    var rows = images.map(function (data) {
      var card = document.createElement('div');
      card.className = 'image-card';

      var figure = document.createElement('div');
      figure.className = 'image-card-figure';
      var img = document.createElement('img');
      img.src = data.src;
      img.alt = data.caption === 'Caption pending.' ? '' : data.caption;
      img.loading = 'lazy';
      figure.appendChild(img);
      card.appendChild(figure);

      var captionEl = document.createElement('p');
      captionEl.className = 'image-card-caption';
      captionEl.textContent = data.caption;
      card.appendChild(captionEl);

      var keywords = document.createElement('div');
      keywords.className = 'image-card-keywords';
      keywords.appendChild(makeKeywordLink(data.section, sectionSelect, false));
      keywords.appendChild(makeKeywordLink(data.decade, decadeSelect, false));
      keywords.appendChild(makeKeywordLink(data.collection, collectionSelect, true));
      card.appendChild(keywords);

      listEl.appendChild(card);

      return { el: card, data: data };
    });

    function applyFilters() {
      var section = sectionSelect.value;
      var decade = decadeSelect.value;
      var collection = collectionSelect.value;
      var visibleCount = 0;

      rows.forEach(function (r) {
        var matches = true;
        if (section && r.data.section !== section) matches = false;
        if (decade && r.data.decade !== decade) matches = false;
        if (collection && r.data.collection !== collection) matches = false;

        r.el.classList.toggle('is-hidden', !matches);
        if (matches) visibleCount++;
      });

      countEl.textContent = 'Showing ' + visibleCount + ' of ' + rows.length + ' images';
      emptyEl.classList.toggle('is-visible', visibleCount === 0);
    }

    [sectionSelect, decadeSelect, collectionSelect].forEach(function (el) {
      el.addEventListener('change', applyFilters);
    });

    resetBtn.addEventListener('click', function () {
      sectionSelect.value = '';
      decadeSelect.value = '';
      collectionSelect.value = '';
      applyFilters();
    });

    applyFilters();
  })();
</script>
</html>
